<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil del Egresado - Sistema de Gestión de Egresados</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header class="header-sistema">

        <div class="contenedor-header">
            <h1>Universidad CENFOTEC</h1>
            <p class="subtitulo-modulo">
                Sistema de Gestión de Egresados
            </p>
        </div>

        <nav class="navegacion-principal">

            <a href="index.html">Inicio</a>
            <a href="perfil.html" class="enlace-activo">Mi Perfil</a>
            <a href="gestion-empleos.html">Empleos</a>
            <a href="index-publico.html">Página Pública</a>
            <a href="login.html">Cerrar Sesión</a>

        </nav>

    </header>

    <main class="contenedor-principal">

        <section class="seccion-formulario">

            <div class="encabezado-formulario">

                <h2>Perfil del Egresado</h2>

                <p>
                    Actualice su información personal y profesional.
                </p>

            </div>

           <form id="formPerfil" class="formulario-control" novalidate>

                <div class="grupo-formulario">

                    <label for="identificacion">
                        Identificación
                    </label>

                    <input
                        type="text"
                        id="identificacion"
                        placeholder="Ej: 123456789">

                </div>

                <div class="grupo-formulario">

                    <label for="nombreCompleto">
                        Nombre Completo
                    </label>

                    <input
                        type="text"
                        id="nombreCompleto"
                        placeholder="Ingrese su nombre completo">

                </div>

                <div class="grupo-formulario">

                    <label for="correoElectronico">
                        Correo Electrónico
                    </label>

                    <input
                        type="email"
                        id="correoElectronico"
                        placeholder="correo@correo.com">

                </div>

                <div class="grupo-formulario">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        placeholder="8888-8888">

                </div>

                <div class="grupo-formulario">

                    <label for="fechaRegistro">
                        Fecha de Registro
                    </label>

                    <input
                        type="date"
                        id="fechaRegistro">

                </div>

                <div class="grupo-formulario">

                    <label for="empresaActual">
                        Empresa Actual
                    </label>

                    <input
                        type="text"
                        id="empresaActual"
                        placeholder="Nombre de la empresa">

                </div>

                <div class="grupo-formulario">

                    <label for="puestoActual">
                        Puesto Actual
                    </label>

                    <input
                        type="text"
                        id="puestoActual"
                        placeholder="Ej: Desarrollador Web">

                </div>

                <div class="grupo-formulario">

                    <label for="areaProfesional">
                        Área Profesional
                    </label>

                    <input
                        type="text"
                        id="areaProfesional"
                        placeholder="Ej: Tecnología">

                </div>

                <div class="grupo-formulario">

                    <label for="linkedin">
                        LinkedIn
                    </label>

                    <input
                        type="text"
                        id="linkedin"
                        placeholder="linkedin.com/in/usuario">

                </div>

                <div class="grupo-formulario">

                    <label for="portafolio">
                        Portafolio
                    </label>

                    <input
                        type="text"
                        id="portafolio"
                        placeholder="www.miportafolio.com">

                </div>

                <div class="acciones-formulario">

                    <button
                        type="submit"
                        class="boton-guardar">

                        Guardar Perfil

                    </button>

                </div>

            </form>

        </section>

    </main>

    <footer class="pie-sistema">

        <p>

            &copy; 2026 Universidad CENFOTEC - Sistema de Gestión de Egresados

        </p>

    </footer>

    <script src="../js/perfil-api.js"></script>

</body>

</html>
